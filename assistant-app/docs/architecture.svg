<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 635" role="img"><title>Architecture of the full-stack AI assistant</title><desc>Browser UI with chat, photos, files and voice goes through a Next.js proxy to a FastAPI backend. The backend uses Ollama, Gemini and other cloud models, and a voice agent worker connects to LiveKit Cloud.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.box{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.box+.th,.box+.th+.ts{fill:#2C2C2A}.box+.th+.ts{fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.lbl{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="635" fill="#ffffff"/>
<rect x="30" y="20" width="610" height="104" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts lbl" x="45" y="38">Browser · Next.js 16, React 19</text>
<g class="c-purple"><rect x="45" y="50" width="130" height="56" rx="4"/><text class="th" x="110" y="72" text-anchor="middle">Chat</text><text class="ts" x="110" y="90" text-anchor="middle">Stream, history</text></g>
<g class="c-purple"><rect x="195" y="50" width="130" height="56" rx="4"/><text class="th" x="260" y="72" text-anchor="middle">Photos</text><text class="ts" x="260" y="90" text-anchor="middle">Vision input</text></g>
<g class="c-purple"><rect x="345" y="50" width="130" height="56" rx="4"/><text class="th" x="410" y="72" text-anchor="middle">Files</text><text class="ts" x="410" y="90" text-anchor="middle">Cited answers</text></g>
<g class="c-purple"><rect x="495" y="50" width="130" height="56" rx="4"/><text class="th" x="560" y="72" text-anchor="middle">Voice mode</text><text class="ts" x="560" y="90" text-anchor="middle">Mic, transcript</text></g>
<line class="arr" x1="335" y1="124" x2="335" y2="158" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="45" y="160" width="580" height="34" rx="4"/><text class="th" x="335" y="182" text-anchor="middle">Next.js server · /api proxy to FastAPI</text></g>
<line class="arr" x1="335" y1="194" x2="335" y2="220" marker-end="url(#arrow)"/>
<rect x="30" y="222" width="610" height="170" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts lbl" x="45" y="240">FastAPI · Python 3.13</text>
<g class="c-teal"><rect x="45" y="250" width="130" height="40" rx="4"/><text class="th" x="110" y="275" text-anchor="middle">/api/chat</text></g>
<g class="c-teal"><rect x="195" y="250" width="130" height="40" rx="4"/><text class="th" x="260" y="275" text-anchor="middle">/api/voice</text></g>
<g class="c-teal"><rect x="345" y="250" width="130" height="40" rx="4"/><text class="th" x="410" y="275" text-anchor="middle">/api/models</text></g>
<g class="c-teal"><rect x="495" y="250" width="130" height="40" rx="4"/><text class="th" x="560" y="275" text-anchor="middle">/api/library</text></g>
<line class="arr" x1="110" y1="290" x2="110" y2="320" marker-end="url(#arrow)"/>
<path class="arr" d="M230 290 V305 H200 V320" marker-end="url(#arrow)"/>
<line class="arr" x1="400" y1="290" x2="400" y2="320" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="290" x2="560" y2="320" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="45" y="322" width="180" height="56" rx="4"/><text class="th" x="135" y="344" text-anchor="middle">Chat service</text><text class="ts" x="135" y="362" text-anchor="middle">Stream, fallback</text></g>
<g class="c-teal"><rect x="250" y="322" width="180" height="56" rx="4"/><text class="th" x="340" y="344" text-anchor="middle">Provider registry</text><text class="ts" x="340" y="362" text-anchor="middle">Local first, then cloud</text></g>
<g class="c-teal"><rect x="455" y="322" width="180" height="56" rx="4"/><text class="th" x="545" y="344" text-anchor="middle">Library service</text><text class="ts" x="545" y="362" text-anchor="middle">RagEngine, SQLite, queue</text></g>
<line class="arr" x1="225" y1="350" x2="250" y2="350" marker-end="url(#arrow)"/>
<path class="arr" d="M270 378 V410 H110 V428" marker-end="url(#arrow)"/>
<line class="arr" x1="300" y1="378" x2="300" y2="428" marker-end="url(#arrow)"/>
<line class="arr" x1="400" y1="378" x2="400" y2="428" marker-end="url(#arrow)"/>
<line class="arr" x1="465" y1="378" x2="465" y2="428" marker-end="url(#arrow)"/>
<rect class="box" x="45" y="430" width="130" height="56" rx="4"/><text class="th" x="110" y="452" text-anchor="middle">Ollama</text><text class="ts" x="110" y="470" text-anchor="middle">Local models</text>
<rect class="box" x="195" y="430" width="130" height="56" rx="4"/><text class="th" x="260" y="452" text-anchor="middle">Other clouds</text><text class="ts" x="260" y="470" text-anchor="middle">Claude, OpenAI…</text>
<rect class="box" x="345" y="430" width="130" height="56" rx="4"/><text class="th" x="410" y="452" text-anchor="middle">Gemini</text><text class="ts" x="410" y="470" text-anchor="middle">Chat + RAG</text>
<g class="c-teal"><rect x="495" y="430" width="130" height="56" rx="4"/><text class="th" x="560" y="452" text-anchor="middle">Voice agent</text><text class="ts" x="560" y="470" text-anchor="middle">Python worker</text></g>
<line class="arr" x1="560" y1="430" x2="560" y2="394" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="486" x2="560" y2="518" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect class="box" x="495" y="520" width="130" height="56" rx="4"/><text class="th" x="560" y="542" text-anchor="middle">LiveKit Cloud</text><text class="ts" x="560" y="560" text-anchor="middle">STT, TTS, WebRTC</text>
<path class="arr" d="M625 78 H658 V548 H627" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="45" y="604" width="12" height="12" rx="2" class="c-purple"/><text class="ts lbl" x="63" y="614">Frontend</text>
<rect x="140" y="604" width="12" height="12" rx="2" class="c-teal"/><text class="ts lbl" x="158" y="614">Our backend code</text>
<rect x="285" y="604" width="12" height="12" rx="2" class="box"/><text class="ts lbl" x="303" y="614">External service</text>
<line x1="420" y1="610" x2="448" y2="610" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ts lbl" x="456" y="614">Live audio (WebRTC)</text>
</svg>
