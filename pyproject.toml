[project]
name = "full-stack-ai-agent"
version = "0.1.0"
description = "Full-stack AI assistant: chat, voice, photos and file Q&A with citations. Local Ollama first, cloud fallback."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.3",
]

[project.scripts]
full-stack-ai-agent = "full_stack_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
